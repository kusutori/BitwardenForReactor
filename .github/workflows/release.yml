name: GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_DIRECTORY: BitwardenForReactor

jobs:
  portable:
    name: Build portable ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIRECTORY }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve release version
        id: release
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Trim()
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Version '$version' must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH.REVISION."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        working-directory: ${{ env.APP_DIRECTORY }}
        run: >-
          dotnet restore BitwardenForReactor.csproj
          -p:Platform=${{ matrix.platform }}
          -p:NativeAot=true
          -r ${{ matrix.rid }}

      - name: Publish Native AOT application
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "publish-${{ matrix.platform }}"
          dotnet publish BitwardenForReactor.csproj --no-restore -c Release `
            -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.platform }} `
            -p:NativeAot=true `
            -p:Version=${{ steps.release.outputs.version }} `
            -o $publishDir

          $requiredFiles = @('BitwardenForReactor.exe', 'BitwardenForReactor.pri')
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $publishDir $requiredFile))) {
              throw "Publish output is missing $requiredFile."
            }
          }
          if ((Get-ChildItem (Join-Path $publishDir 'Strings') -Recurse -Filter *.resw).Count -lt 1) {
            throw 'Publish output is missing localized RESW files.'
          }

          Copy-Item README.md, LICENSE -Destination $publishDir
          $symbols = Get-Item (Join-Path $publishDir 'BitwardenForReactor.pdb')
          $symbolsArchive = Join-Path $env:RUNNER_TEMP "BitwardenForReactor-${{ steps.release.outputs.version }}-${{ matrix.platform }}-symbols.zip"
          Compress-Archive -Path $symbols.FullName -DestinationPath $symbolsArchive -CompressionLevel Optimal
          Remove-Item $symbols.FullName -Force

          $archive = Join-Path $env:RUNNER_TEMP "BitwardenForReactor-${{ steps.release.outputs.version }}-${{ matrix.platform }}-portable.zip"
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: ${{ runner.temp }}/BitwardenForReactor-${{ steps.release.outputs.version }}-${{ matrix.platform }}-*.zip
          if-no-files-found: error

  signed-msix:
    name: Build signed MSIX ${{ matrix.platform }}
    if: vars.ENABLE_SIGNED_MSIX == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIRECTORY }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate signing configuration
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.PACKAGE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.PACKAGE_PUBLISHER_DISPLAY_NAME }}
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $required = @{
            PACKAGE_IDENTITY_NAME = $env:IDENTITY_NAME
            PACKAGE_PUBLISHER = $env:PUBLISHER
            PACKAGE_PUBLISHER_DISPLAY_NAME = $env:PUBLISHER_DISPLAY_NAME
            MSIX_CERTIFICATE_BASE64 = $env:CERTIFICATE_BASE64
            MSIX_CERTIFICATE_PASSWORD = $env:CERTIFICATE_PASSWORD
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions configuration: $($missing -join ', ')"
          }

      - name: Stamp package identity and version
        id: package
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          IDENTITY_NAME: ${{ vars.PACKAGE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.PACKAGE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.PACKAGE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = ./build/Set-PackageIdentity.ps1 `
            -ManifestPath ./Package.appxmanifest `
            -Tag $env:RELEASE_TAG `
            -IdentityName $env:IDENTITY_NAME `
            -Publisher $env:PUBLISHER `
            -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
          EXPECTED_PUBLISHER: ${{ vars.PACKAGE_PUBLISHER }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "release-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($certificate.Subject -ne $env:EXPECTED_PUBLISHER) {
            throw "Certificate subject '$($certificate.Subject)' does not match PACKAGE_PUBLISHER '$($env:EXPECTED_PUBLISHER)'."
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Restore
        working-directory: ${{ env.APP_DIRECTORY }}
        run: dotnet restore BitwardenForReactor.csproj -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }}

      - name: Build signed MSIX
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "AppPackages\"
          dotnet build BitwardenForReactor.csproj --no-restore -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:RuntimeIdentifier=${{ matrix.rid }} `
            -p:ReactorPackaged=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=${{ steps.certificate.outputs.thumbprint }} `
            -p:AppxPackageDir="$packageDir"

          $package = Get-ChildItem $packageDir -Recurse -Filter *.msix |
            Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "The build completed without producing an MSIX package."
          }

          $output = Join-Path $env:RUNNER_TEMP "BitwardenForReactor-${{ steps.package.outputs.version }}-${{ matrix.platform }}.msix"
          Copy-Item $package.FullName $output

      - name: Export public development certificate
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          Export-Certificate `
            -Cert "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}" `
            -FilePath (Join-Path $env:RUNNER_TEMP 'BitwardenForReactor-Development.cer') `
            -Type CERT | Out-Null
          Copy-Item '${{ env.APP_DIRECTORY }}/docs/development-msix-install.md' `
            (Join-Path $env:RUNNER_TEMP 'DEVELOPMENT-MSIX-INSTALL.md')

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: signed-msix-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/BitwardenForReactor-${{ steps.package.outputs.version }}-${{ matrix.platform }}.msix
            ${{ runner.temp }}/BitwardenForReactor-Development.cer
            ${{ runner.temp }}/DEVELOPMENT-MSIX-INSTALL.md
          if-no-files-found: error

      - name: Remove signing certificate
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}" -Force -ErrorAction SilentlyContinue

  release:
    name: Create GitHub Release
    if: always() && needs.portable.result == 'success' && needs.signed-msix.result != 'failure'
    needs:
      - portable
      - signed-msix
    runs-on: windows-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: "portable-*"
          path: packages
          merge-multiple: true

      - name: Download signed MSIX packages
        if: needs.signed-msix.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: "signed-msix-*"
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          generate_release_notes: true
          files: packages/*
