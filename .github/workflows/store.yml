name: Package for Microsoft Store

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "MSIX version tag, for example v1.2.3"
        required: true
        type: string
      publish:
        description: "Submit the generated package to Partner Center"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  APP_DIRECTORY: BitwardenForReactor

jobs:
  package:
    name: Build Store upload package
    runs-on: windows-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIRECTORY }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate Store configuration
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $required = @{
            STORE_IDENTITY_NAME = $env:IDENTITY_NAME
            STORE_PUBLISHER = $env:PUBLISHER
            STORE_PUBLISHER_DISPLAY_NAME = $env:PUBLISHER_DISPLAY_NAME
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions configuration: $($missing -join ', ')"
          }

      - name: Stamp Store identity and version
        id: package
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = ./build/Set-PackageIdentity.ps1 `
            -ManifestPath ./Package.appxmanifest `
            -Tag $env:RELEASE_TAG `
            -IdentityName $env:IDENTITY_NAME `
            -Publisher $env:PUBLISHER `
            -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        working-directory: ${{ env.APP_DIRECTORY }}
        run: dotnet restore BitwardenForReactor.csproj -p:Platform=x64

      - name: Build Store upload package
        working-directory: ${{ env.APP_DIRECTORY }}
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "StorePackages\"
          dotnet build BitwardenForReactor.csproj --no-restore -c Release `
            -p:Platform=x64 `
            -p:ReactorPackaged=true `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:UapAppxPackageBuildMode=CI `
            -p:AppxBundle=Always `
            '-p:AppxBundlePlatforms=x64|ARM64' `
            -p:AppxPackageDir="$packageDir"

          $upload = Get-ChildItem $packageDir -Recurse -Filter *.msixupload | Select-Object -First 1
          if ($null -eq $upload) {
            throw "The build completed without producing an MSIXUPLOAD package."
          }
          "upload_path=$($upload.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-msixupload-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.upload_path }}
          if-no-files-found: error

      - name: Configure Microsoft Store CLI
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Validate Partner Center credentials
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $required = @{
            STORE_PRODUCT_ID = $env:PRODUCT_ID
            AZURE_AD_TENANT_ID = $env:TENANT_ID
            SELLER_ID = $env:SELLER_ID
            AZURE_AD_APPLICATION_CLIENT_ID = $env:CLIENT_ID
            AZURE_AD_APPLICATION_SECRET = $env:CLIENT_SECRET
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing Partner Center configuration: $($missing -join ', ')"
          }

      - name: Authenticate Microsoft Store CLI
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId '${{ secrets.AZURE_AD_TENANT_ID }}' `
            --sellerId '${{ secrets.SELLER_ID }}' `
            --clientId '${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}' `
            --clientSecret '${{ secrets.AZURE_AD_APPLICATION_SECRET }}'

      - name: Submit package to Partner Center
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: msstore publish '${{ env.APP_DIRECTORY }}' -i '${{ steps.package.outputs.upload_path }}' -id '${{ vars.STORE_PRODUCT_ID }}'
